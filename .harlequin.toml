# Harlequin config
# Theme selection is stable; the local launcher maps adaptive to the shared
# state published by ~/script/theme-sync:
#   dark  -> moonfly
#   light -> sunfly
# Moonfly and Sunfly themes are registered by the local Harlequin launcher
# from ~/.config/harlequin/sunfly_textual_themes.py.
# Keep shared profile definitions here.
# Project-local .harlequin.toml files should only set default_profile,
# because Harlequin shallow-merges top-level config tables.
default_profile = "local-backend"

[[keymaps.pane-nav]]
keys = "ctrl+left"
action = "focus_data_catalog"
key_display = "^←"

[[keymaps.pane-nav]]
keys = "ctrl+down"
action = "focus_results_viewer"
key_display = "^↓"

[[keymaps.pane-nav]]
keys = "ctrl+up"
action = "focus_query_editor"
key_display = "^↑"

[[keymaps.pane-nav]]
keys = "ctrl+right"
action = "focus_query_editor"
key_display = "^→"

[[keymaps.pane-nav]]
keys = "ctrl+h"
action = "code_editor.previous_buffer"
key_display = "^H"

[[keymaps.pane-nav]]
keys = "ctrl+l"
action = "code_editor.next_buffer"
key_display = "^L"

[[keymaps.pane-nav]]
keys = "ctrl+h"
action = "data_catalog.previous_tab"
key_display = "^H"

[[keymaps.pane-nav]]
keys = "ctrl+l"
action = "data_catalog.next_tab"
key_display = "^L"

[[keymaps.pane-nav]]
keys = "ctrl+h"
action = "results_viewer.previous_tab"
key_display = "^H"

[[keymaps.pane-nav]]
keys = "ctrl+l"
action = "results_viewer.next_tab"
key_display = "^L"

[profiles.local-backend]
adapter = "postgres"
theme = "adaptive"
limit = 100000
keymap_name = ["vscode", "pane-nav"]
conn_str = ["postgres://developer_readonly:developer_readonly_password@localhost:5432/data_catalog_db"]

[profiles.staging-backend]
adapter = "postgres"
theme = "adaptive"
limit = 100000
keymap_name = ["vscode", "pane-nav"]
conn_str = ["postgres://developer_readonly:developer_readonly_password@localhost:6432/data_catalog_db"]

[profiles.databricks]
adapter = "databricks"
theme = "adaptive"
limit = 100000
keymap_name = ["vscode", "pane-nav"]
server_hostname = "dbc-7d988bc8-62a9.cloud.databricks.com"
http_path = "/sql/1.0/warehouses/efb33512195839f4"
auth_type = "databricks-oauth"
skip_legacy_indexing = true

[profiles.s3]
adapter = "duckdb"
theme = "adaptive"
limit = 100000
keymap_name = ["vscode", "pane-nav"]
show_s3 = "s3://databricks-junk-staging-4e6dcba8-4121-4625-816d-36930f791a64/bryan@lumoratech.com/"
extension = ["httpfs", "aws"]
